name: Update quotes and deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Refresh once per hour. GitHub may delay scheduled runs by a few minutes.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      deployments: read
    outputs:
      due: ${{ steps.freshness.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: freshness
        with:
          script: |
            const { refreshDue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/refresh-due.mjs`);
            return await refreshDue({ github, context });
  build:
    needs: refresh
    if: needs.refresh.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Fetch verified quotes
        run: pnpm fetch:data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static Dashboard
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_PRIVATE_REPORTS_URL: ${{ vars.PRIVATE_REPORTS_URL }}
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
